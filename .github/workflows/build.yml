name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # uzywa wrappera (gradlew), a jesli go nie ma - najnowszego Gradle
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ hashFiles('gradlew') != '' && 'wrapper' || 'current' }}

      - name: Build
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew build; else gradle build; fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chestsmp-tools
          path: build/libs/*.jar
