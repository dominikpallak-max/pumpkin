name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generuj pliki moda
        run: |
          mkdir -p src/main/java/pl/upiorny/drop src/main/resources

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.3
          loader_version=0.18.1
          fabric_version=0.139.4+1.21.11
          mod_version=1.0.0
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          version = project.mod_version
          group = 'pl.upiorny'
          base { archivesName = 'upiorny-drop' }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "upiornydrop",
            "version": "${version}",
            "name": "Upiorny Drop",
            "description": "Pokazuje drop Upiornej Skrzyni w tooltipie.",
            "environment": "client",
            "entrypoints": { "client": ["pl.upiorny.drop.UpiornyDropClient"] },
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          EOF

          cat > src/main/java/pl/upiorny/drop/UpiornyDropClient.java <<'EOF'
          package pl.upiorny.drop;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.item.v1.ItemTooltipCallback;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.text.Text;

          import java.util.List;
          import java.util.regex.*;

          public class UpiornyDropClient implements ClientModInitializer {
              private static final Pattern CHEST = Pattern.compile("Upiorna Skrzynia.*?Poziom:?\\s*(\\d+)", Pattern.CASE_INSENSITIVE);

              @Override
              public void onInitializeClient() {
                  DropConfig.load();

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) ->
                      dispatcher.register(ClientCommandManager.literal("minecraftserver").executes(ctx -> {
                          MinecraftClient mc = ctx.getSource().getClient();
                          mc.send(() -> mc.setScreen(new ToggleScreen()));
                          return 1;
                      })));

                  ItemTooltipCallback.EVENT.register((stack, context, type, lines) -> {
                      if (!DropConfig.INSTANCE.enabled || stack.isEmpty()) return;
                      Matcher m = CHEST.matcher(stack.getName().getString());
                      if (!m.find()) return;
                      List<String> drop = DropConfig.INSTANCE.drops.get(m.group(1));
                      if (drop == null || drop.isEmpty()) return;

                      int idx = lines.size();
                      for (int i = 1; i < lines.size(); i++) {
                          if (lines.get(i).getString().startsWith("minecraft:")) { idx = i; break; }
                      }
                      lines.add(idx++, Text.literal(""));
                      lines.add(idx++, Text.literal("\u00a76Drop ze skrzyni (Poziom " + m.group(1) + "):"));
                      for (String s : drop) lines.add(idx++, Text.literal(s.replace('&', '\u00a7')));
                  });
              }
          }
          EOF

          cat > src/main/java/pl/upiorny/drop/ToggleScreen.java <<'EOF'
          package pl.upiorny.drop;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          public class ToggleScreen extends Screen {
              public ToggleScreen() {
                  super(Text.literal("Upiorny Drop"));
              }

              private Text label() {
                  boolean on = DropConfig.INSTANCE.enabled;
                  return Text.literal("Pokazuj drop: ").append(
                      Text.literal(on ? "WLACZONE" : "WYLACZONE").formatted(on ? Formatting.GREEN : Formatting.RED));
              }

              @Override
              protected void init() {
                  addDrawableChild(ButtonWidget.builder(label(), b -> {
                      DropConfig.INSTANCE.enabled = !DropConfig.INSTANCE.enabled;
                      DropConfig.save();
                      b.setMessage(label());
                  }).dimensions(width / 2 - 80, height / 2 - 10, 160, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("Zamknij"), b -> close())
                      .dimensions(width / 2 - 50, height / 2 + 20, 100, 20).build());
              }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  super.render(ctx, mouseX, mouseY, delta);
                  ctx.drawCenteredTextWithShadow(textRenderer, title, width / 2, height / 2 - 35, 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/pl/upiorny/drop/DropConfig.java <<'EOF'
          package pl.upiorny.drop;

          import com.google.gson.*;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.*;
          import java.util.*;

          public class DropConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path PATH = FabricLoader.getInstance().getConfigDir().resolve("upiorny_drop.json");

              public boolean enabled = true;
              public Map<String, List<String>> drops = defaults();

              public static DropConfig INSTANCE = new DropConfig();

              public static void load() {
                  try {
                      if (Files.exists(PATH)) {
                          DropConfig c = GSON.fromJson(Files.readString(PATH), DropConfig.class);
                          if (c != null) {
                              if (c.drops == null) c.drops = defaults();
                              INSTANCE = c;
                              return;
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  INSTANCE = new DropConfig();
                  save();
              }

              public static void save() {
                  try {
                      Files.writeString(PATH, GSON.toJson(INSTANCE));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private static Map<String, List<String>> defaults() {
                  Map<String, List<String>> m = new LinkedHashMap<>();
                  m.put("1", new ArrayList<>(List.of(
                      "&b Diamentowy miecz (Ostrosc IV)",
                      "&b Diamentowy helm (Ochrona III)",
                      "&b Diamentowe narzedzia i zbroja",
                      "&e Zaklete zlote jablko",
                      "&b Diament x64",
                      "&a Szmaragd x64",
                      "&f Obsydian x64",
                      "&d Zaklinacz Przedmiotow",
                      "&f Fajerwerk",
                      "&7 Ksiazki, spawnery, bloki i inne"
                  )));
                  m.put("2", new ArrayList<>(List.of(
                      "&d Ametystowy Luk (Moc VI, Plomien, Uderzenie III)",
                      "&d Ametystowe narzedzia i zbroja",
                      "&c Dodatkowe Zycie",
                      "&d Krysztal Ametystu",
                      "&b Diamentowe przedmioty",
                      "&7 Ksiazki, bloki i inne"
                  )));
                  m.put("3", new ArrayList<>(List.of(
                      "&d Ametystowe narzedzia i zbroja",
                      "&f Szkielet (spawner)",
                      "&b EnderChest Booster",
                      "&c Anty-Web",
                      "&6 Zlote przedmioty",
                      "&7 Ksiazki, bloki i inne"
                  )));
                  return m;
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: upiorny-drop
          path: build/libs/*.jar
