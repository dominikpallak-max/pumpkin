name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Znajdz projekt
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "Brak settings.gradle w repo - wrzuc pliki moda (nie zip)!"; exit 1; fi
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew build; else gradle build; fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chestsmp-tools
          path: ${{ env.PROJ }}/build/libs/*.jar
